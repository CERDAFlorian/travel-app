name: Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verifier que les WebP sont a jour
        run: npm run img:check

      - name: Verifier le SQL Supabase
        run: npm run sql:check

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires
        run: npm test

      # La branche dev vise la base de DEV, comme .env.local en local.
      #
      # Ce build est une verification : son artefact n'est servi nulle part, et
      # rien n'en depend aujourd'hui. Il embarquait pourtant les identifiants de
      # PROD, ce qui est faux par principe — une branche de travail n'a aucune
      # raison de fabriquer un bundle pointant la base qui porte les vrais
      # voyages. Le jour ou l'on telechargera cet artefact, ou qu'on en fera une
      # preview, la question ne se posera meme pas.
      #
      # deploy.yml, lui, garde VITE_SUPABASE_URL / _ANON_KEY : c'est main qui
      # part en production, et c'est la seule branche qui doit voir la prod.
      - name: Verifier que les secrets de dev existent
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL_DEV }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_DEV }}
        run: |
          # Sans ce controle, un secret absent donne une chaine vide : le build
          # REUSSIT et produit un bundle sans configuration, qui ne leverait
          # qu'a l'ouverture. Une CI verte pour un artefact mort-ne est pire
          # qu'un echec.
          test -n "$URL" || { echo "::error::Secret VITE_SUPABASE_URL_DEV absent. A creer dans Settings > Secrets and variables > Actions."; exit 1; }
          test -n "$KEY" || { echo "::error::Secret VITE_SUPABASE_ANON_KEY_DEV absent. A creer dans Settings > Secrets and variables > Actions."; exit 1; }

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_DEV }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_DEV }}
