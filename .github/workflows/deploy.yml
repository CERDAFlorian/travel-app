name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and trigger Coolify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Trigger Coolify deployment
        run: |
          if [ -z "${COOLIFY_DEPLOY_WEBHOOK}" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK is missing in GitHub Actions secrets."
            exit 1
          fi

          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "COOLIFY_TOKEN is missing in GitHub Actions secrets."
            exit 1
          fi

          curl --fail --request GET "${COOLIFY_DEPLOY_WEBHOOK}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}"
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
