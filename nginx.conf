server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # woff2 et webp sont déjà compressés : les regzipper coûte du CPU pour rien.
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Fallback SPA : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés par Vite : cache agressif
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html et service worker : jamais en cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Le script qui enregistre le service worker : il doit pouvoir pointer vers
    # un nouveau sw.js. Mis en cache, il figerait la version installée.
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Runtime Workbox : son nom porte un hash, il ne change jamais à contenu égal.
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Polices et images ne sont PAS hashées : `immutable` les figerait pour un an
    # après une régénération. Un mois et une semaine suffisent — le service
    # worker gère de toute façon leur révision via son propre manifeste.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}